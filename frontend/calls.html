<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Домофон — Звонки</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="calls.html" data-page="calls.html">Звонки</a>
      <a href="users.html" data-page="users.html">Пользователи</a>
      <span class="user"></span>
    </nav>
  </header>

  <main>
    <section>
      <h2>Позвонить</h2>
      <form class="inline" id="call-form" style="grid-template-columns: 1fr auto;">
        <select id="callee" required>
          <option value="">— выберите абонента —</option>
        </select>
        <button type="submit" class="ok">Позвонить</button>
      </form>
      <div class="error" id="call-error"></div>
      <p class="muted" style="margin-top:8px;">История обновляется автоматически каждые 5 секунд.</p>
    </section>

    <section>
      <h2>История звонков</h2>
      <table id="history-table">
        <thead>
         <th>ID</th><th>От</th><th>Кому</th><th>Статус</th><th>Время</th><th>Длительность</th><th>Действия</th>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/calls.js"></script>
</body>
</html>
