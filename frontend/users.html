<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Домофон — Пользователи</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="calls.html" data-page="calls.html">Звонки</a>
      <a href="users.html" data-page="users.html">Пользователи</a>
      <span class="user"></span>
    </nav>
  </header>

  <main>
    <section id="admin-only">
      <h2>Добавить пользователя</h2>
      <form class="inline" id="create-form">
        <input name="name" placeholder="Имя" required />
        <input name="apartment_number" placeholder="Квартира" required />
        <input name="house" placeholder="Дом" value="Дом 1" required />
        <input name="phone" placeholder="+7..." required />
        <input name="password" type="password" placeholder="Пароль" required />
        <select name="role">
          <option value="resident">resident</option>
          <option value="admin">admin</option>
        </select>
        <button type="submit">Создать</button>
      </form>
      <div class="error" id="create-error"></div>
    </section>

    <section>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <h2 style="margin: 0;">Список пользователей</h2>
        <label style="font-size: 14px;">
          Дом:
          <select id="filter-house" style="margin-left: 6px;">
            <option value="">— все —</option>
          </select>
        </label>
      </div>
      <table id="users-table">
        <thead>
          <tr>
            <th>ID</th><th>Имя</th><th>Квартира</th><th>Дом</th><th>Телефон</th><th>Роль</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
