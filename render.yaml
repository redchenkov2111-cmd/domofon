databases:
  - name: domofon-db
    databaseName: domofon
    user: domofon
    plan: free

services:
  - type: redis
    name: domofon-redis
    plan: free
    ipAllowList: []

  - type: web
    name: user-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn user_service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: domofon-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: domofon-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true 
      - key: LOGGING_SERVICE_URL
        value: https://logging-service-jiwk:10000

  - type: web
    name: call-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn call_service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: domofon-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: domofon-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: user-service
          envVarKey: JWT_SECRET
      - key: LOGGING_SERVICE_URL
        value: https://logging-service-jiwk:10000


  - type: web
    name: call-provider
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn call_provider.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: USER_SERVICE_URL
        value: https://user-service-x69e:10000
      - key: CALL_SERVICE_URL
        value: https://call-service-f9jz:10000
      - key: LOGGING_SERVICE_URL
        value: https://logging-service-jiwk:10000

  - type: web
    name: logging-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn logging_service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: domofon-db
          property: connectionString

  - type: web
    name: api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn api_gateway.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: USER_SERVICE_URL
        value: https://user-service-x69e:10000
      - key: CALL_SERVICE_URL
        value: https://call-service-f9jz:10000
      - key: CALL_PROVIDER_URL
        value: https://call-provider-q8kv:10000
      - key: LOGGING_SERVICE_URL
        value: https://logging-service-jiwk:10000
      - key: REDIS_URL
        fromService:
          type: redis
          name: domofon-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: user-service
          envVarKey: JWT_SECRET